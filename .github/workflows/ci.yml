name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        # v2 downloads the release asset from github.com; pinning the version
        # skips tag resolution entirely (no GitHub API call). Keep in sync with
        # .github/workflows/release.yml.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install

      # Intentionally typecheck-only: the test suite has one pre-existing RPG
      # failure that would block pull requests until it is fixed separately.
      - name: Typecheck
        run: bun run typecheck
